function prepOCR(c){const w=Math.min(1600,c.width),h=Math.round(c.height*w/c.width);const o=document.createElement('canvas');o.width=w;o.height=h;const x=o.getContext('2d');x.drawImage(c,0,0,w,h);

 else if(wz.step===2)body=head(3)+`<p class="q">${Y.q3}</p><div class="grid3">${BUD.map((b,i)=>`<button type="button" data-v="${i}"><i>💶</i>${Y.upTo} ${b} ${cur()}</button>`).join('')}</div>`;
 else{const lb=(Y.ideaLbl||Y.ideas)[wz.like];body=`<p class="q">${Y.ideasT} <em>${Y.who[wz.who]}</em></p>`+Y.ideas[wz.like].map((t,i)=>{const q=t+(wz.who===4?' '+Y.kid:'');return `<a class="idea" href="${amazonUrl({what:q,budget:BUD[wz.bud]},{sort:'review-rank'})}" target="_blank" rel="noopener sponsored"><div><b>${esc(lb[i])}</b><small>${Y.best.slice(2)} · ${Y.upTo} ${BUD[wz.bud]} ${cur()}</small></div><span>→</span></a>`}).join('')}
 undock();h.innerHTML=`<div class="wz">${body}<div class="row"><button class="opt" type="button" id="wb">${Y.back}</button>${wz.step===3?`<button class="opt" type="button" id="wn">${L[lang].again}</button>`:''}</div></div>`;
 if(wz.step<3)hfNext();h.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{fromVoice=false;pick(+b.dataset.v)});
 $('#wb').onclick=()=>{if(wz.step===0)home();else{wz.step--;renderWz()}};const wn=$('#wn');if(wn)wn.onclick=()=>{home()};
 if(wz.step<3)speak((wz.step===0?Y.q1:wz.step===1?Y.q2:Y.q3));else speak(Y.ideasT+' '+Y.who[wz.who]+': '+(Y.ideaLbl||Y.ideas)[wz.like].join(', '))}
function pick(v){if(wz.step===0)wz.who=v;else if(wz.step===1)wz.like=v;else if(wz.step===2)wz.bud=v;wz.step++;renderWz()}
function wzVoice(t){const Y=X[lang];t=t.toLowerCase();
 if(wz.step===2){const n=t.match(/\d+/);if(n){const v=+n[0];let i=BUD.findIndex(b=>b>=v);if(i<0)i=BUD.length-1;return pick(i)}}
 const arr=wz.step===0?Y.who:wz.step===1?Y.likes:null;if(arr){const i=arr.findIndex(w=>t.includes(w.toLowerCase()));if(i>=0)return pick(i)}
 $('#hint').textContent=L[lang].empty}
function command(t){const C=X[lang].c,s=t.toLowerCase().trim();
 if(C.gift.test(s)){startWz();return true}
 if(mode==='wz'){wzVoice(s);return true}
 if(mode!=='result'||!last||s.split(/\s+/).length>4)return false;
 if(C.again.test(s)){$('#q').value='';home();return true}
 if(C.save.test(s)){saveCur();speak(X[lang].saved.slice(2));return true}
 if(C.cheap.test(s)){go(amazonUrl(last,{sort:'price-asc-rank'}));return true}
 if(C.best.test(s)){go(amazonUrl(last,{sort:'review-rank'}));return true}
 if(C.newest.test(s)){go(amazonUrl(last,{sort:'date-desc-rank'}));return true}
 for(const m in C.mk)if(C.mk[m].test(s)){go(amazonUrl(last,{dom:MK[m][1]}));return true}
 if(C.open.test(s)){go(amazonUrl(last));return true}
 return refine(s)}
function voiceHelp(){const Y=X[lang];const sh=document.createElement('div');sh.className='sheet';
 sh.innerHTML=`<div class="card" role="dialog" aria-label="${Y.vhT}"><h2>🎙 ${Y.vhT}</h2><div class="vhelp">${Y.vh.map(([a,b])=>`<div><b>${a}</b><br>${b}</div>`).join('')}</div><button class="ok" type="button">${L[lang].ok}</button></div>`;
 sh.onclick=e=>{if(e.target===sh||e.target.classList.contains('ok'))sh.remove()};document.body.appendChild(sh)}

const sel=$('#lang');sel.innerHTML=Object.entries(L).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('');sel.value=lang;
sel.onchange=()=>{lang=sel.value;try{localStorage.setItem('snb-lang',lang)}catch(e){}render()};
const FL={it:'🇮🇹',en:'🇬🇧',es:'🇪🇸',fr:'🇫🇷',de:'🇩🇪',pt:'🇵🇹'},LT={it:['Lingua','Altre lingue'],en:['Language','More languages'],es:['Idioma','Más idiomas'],fr:['Langue','Autres langues'],de:['Sprache','Weitere Sprachen'],pt:['Idioma','Outras línguas']};
function setLang(k){lang=k;sel.value=k;try{localStorage.setItem('snb-lang',k)}catch(e){}render()}
function langBtn(){$('#lb').innerHTML=`${FL[lang]} ${lang.toUpperCase()}`}
$('#lb').onclick=()=>{const t=LT[lang];const sh=document.createElement('div');sh.className='sheet';
 const big=['it','en','es'].map(k=>`<button class="lgo big${k===lang?' on':''}" type="button" data-l="${k}"><span>${FL[k]}</span>${L[k].name}</button>`).join('');
 const sm=['fr','de','pt'].map(k=>`<button class="lgo${k===lang?' on':''}" type="button" data-l="${k}">${FL[k]} ${L[k].name}</button>`).join('');
 sh.innerHTML=`<div class="card" role="dialog" aria-label="${t[0]}"><h2>${t[0]}</h2><div class="lbig">${big}</div><h3 class="lh">${t[1]}</h3><div class="lsm">${sm}</div></div>`;
 sh.onclick=e=>{const b=e.target.closest('[data-l]');if(b){setLang(b.dataset.l);sh.remove()}else if(e.target===sh)sh.remove()};document.body.appendChild(sh)};
$('#hfb').onclick=()=>{hf=!hf;$('#hfb').setAttribute('aria-pressed',hf);if(hf)$('#mic').click()};
$('#f').onsubmit=e=>{e.preventDefault();fromVoice=false;const v=$('#q').value.trim();if(v&&command(v))return;run()};
$('#mic').onclick=()=>{const T=L[lang];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('#q').focus();$('#hint').textContent=T.mic;if(mode==='home')toast(T.mic);return}
 try{if('speechSynthesis' in window)speechSynthesis.cancel();const r=new SR();r.lang=VL[lang];r.interimResults=true;let heard='';
  $('#mic').classList.add('on');document.body.classList.add('listening');$('#hint').textContent=T.listen;
  r.onresult=e=>{heard=[...e.results].map(x=>x[0].transcript).join(' ');if(mode==='home')$('#q').value=heard;else $('#hint').textContent='🎙 '+heard};
  r.onerror=()=>{$('#mic').classList.remove('on');document.body.classList.remove('listening');$('#q').focus();$('#hint').textContent=T.mic};
  r.onend=()=>{$('#mic').classList.remove('on');document.body.classList.remove('listening');const h=heard.trim();if(!h){if($('#hint').textContent===T.listen)$('#hint').textContent='';return}
   fromVoice=true;$('#hint').textContent='';if(command(h))return;$('#q').value=h;run()};
  r.start()}catch(e){$('#mic').classList.remove('on');$('#q').focus();$('#hint').textContent=T.mic}};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{fromVoice=false;const k=b.dataset.k;if(k==='home'){$('#q').value='';home()}else if(k==='disc')discover();else if(k==='spend')showSpend();else showMy();scrollTo(0,0)});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
langBtn();render();
try{const P1=new URLSearchParams(location.search);if(P1.get('boom')==='1'||P1.get('scan')==='1')setTimeout(boomOpen,50)}catch(e){}
try{const P0=new URLSearchParams(location.search),q0=P0.get('q');if(q0){$('#q').value=q0;run();if(P0.get('go')==='1'){const a=document.querySelector('#hero a.cta')||document.querySelector('a.cta');if(a)location.replace(a.href)}}}catch(e){}
</script>
